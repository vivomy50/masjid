<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Panel - Pengurus Masjid</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen text-gray-800 font-sans">

  <!-- Header -->
  <header class="bg-emerald-800 text-white p-4 shadow-md">
    <div class="max-w-4xl mx-auto flex justify-between items-center">
      <h1 class="text-xl font-bold">Admin Panel Pengurus Masjid</h1>
      <a href="index.html" class="bg-emerald-700 hover:bg-emerald-900 text-sm px-3 py-1.5 rounded transition">Ke Tampilan TV</a>
    </div>
  </header>

  <main class="max-w-4xl mx-auto p-4 space-y-6">

    <div id="alertBox" class="hidden p-3 rounded text-sm"></div>

    <form id="adminForm" onsubmit="saveData(event)" class="space-y-6">

      <!-- Profil Masjid -->
      <div class="bg-white p-5 rounded-lg shadow space-y-3">
        <h2 class="text-lg font-bold border-b pb-2 text-emerald-800">1. Profil Masjid</h2>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-semibold uppercase text-gray-600 mb-1">Nama Masjid</label>
            <input type="text" id="namaMasjid" required class="w-full border p-2 rounded outline-none focus:ring-2 focus:ring-emerald-500">
          </div>
          <div>
            <label class="block text-xs font-semibold uppercase text-gray-600 mb-1">Alamat Singkat</label>
            <input type="text" id="alamatMasjid" class="w-full border p-2 rounded outline-none focus:ring-2 focus:ring-emerald-500">
          </div>
        </div>
      </div>

      <!-- Teks & Pengumuman -->
      <div class="bg-white p-5 rounded-lg shadow space-y-3">
        <h2 class="text-lg font-bold border-b pb-2 text-emerald-800">2. Informasi & Teks Tampilan</h2>
        <div>
          <label class="block text-xs font-semibold uppercase text-gray-600 mb-1">Running Text (Teks Berjalan)</label>
          <input type="text" id="runningText" required class="w-full border p-2 rounded outline-none focus:ring-2 focus:ring-emerald-500">
        </div>
        <div>
          <label class="block text-xs font-semibold uppercase text-gray-600 mb-1">Pengumuman Utama</label>
          <textarea id="pengumuman" rows="3" class="w-full border p-2 rounded outline-none focus:ring-2 focus:ring-emerald-500"></textarea>
        </div>
        <div>
          <label class="block text-xs font-semibold uppercase text-gray-600 mb-1">Petugas Jumat (Khotib, Imam, Muadzin)</label>
          <input type="text" id="petugasJumat" placeholder="Khotib: Ustadz A | Imam: Ustadz B" class="w-full border p-2 rounded outline-none focus:ring-2 focus:ring-emerald-500">
        </div>
      </div>

      <!-- Laporan Kas -->
      <div class="bg-white p-5 rounded-lg shadow space-y-3">
        <h2 class="text-lg font-bold border-b pb-2 text-emerald-800">3. Laporan Kas Masjid</h2>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-semibold uppercase text-gray-600 mb-1">Total Pemasukan (Rp)</label>
            <input type="number" id="kasMasuk" required class="w-full border p-2 rounded outline-none focus:ring-2 focus:ring-emerald-500">
          </div>
          <div>
            <label class="block text-xs font-semibold uppercase text-gray-600 mb-1">Total Pengeluaran (Rp)</label>
            <input type="number" id="kasKeluar" required class="w-full border p-2 rounded outline-none focus:ring-2 focus:ring-emerald-500">
          </div>
        </div>
      </div>

      <!-- Agenda Kegiatan -->
      <div class="bg-white p-5 rounded-lg shadow space-y-3">
        <div class="flex justify-between items-center border-b pb-2">
          <h2 class="text-lg font-bold text-emerald-800">4. Agenda Kegiatan</h2>
          <button type="button" onclick="addAgendaRow()" class="text-xs bg-emerald-100 text-emerald-700 hover:bg-emerald-200 px-3 py-1 rounded font-semibold">+ Tambah Agenda</button>
        </div>
        <div id="agendaContainer" class="space-y-2">
          <!-- Dynamically Added -->
        </div>
      </div>

      <!-- Tombol Simpan -->
      <div class="text-right">
        <button type="submit" id="btnSubmit" class="bg-emerald-700 hover:bg-emerald-800 text-white font-bold px-6 py-2.5 rounded-lg shadow-lg transition">
          💾 Simpan Semua Perubahan
        </button>
      </div>

    </form>

  </main>

  <script>
    // Konfigurasi JSONBin
    const BIN_ID = "6ac6e08dffd5d16053579b96";
    const MASTER_KEY = "$2a$10$w/TGjiTxD5bhYT6I8eykduVebFQk3bOUnZWpN.ckTYiscO6nIXyx";
    const API_URL = `https://api.jsonbin.io/v3/b/${BIN_ID}`;

    function showAlert(msg, isSuccess = true) {
      const alertBox = document.getElementById('alertBox');
      alertBox.className = `p-3 rounded text-sm ${isSuccess ? 'bg-green-100 text-green-700 border border-green-300' : 'bg-red-100 text-red-700 border border-red-300'}`;
      alertBox.innerText = msg;
      alertBox.classList.remove('hidden');
      setTimeout(() => alertBox.classList.add('hidden'), 4000);
    }

    function addAgendaRow(tgl = '', kegiatan = '') {
      const container = document.getElementById('agendaContainer');
      const row = document.createElement('div');
      row.className = 'flex gap-2 items-center agenda-row';
      row.innerHTML = `
        <input type="text" placeholder="Tanggal / Waktu" value="${tgl}" class="agenda-tgl w-1/3 border p-2 rounded text-sm outline-none">
        <input type="text" placeholder="Nama Kegiatan" value="${kegiatan}" class="agenda-nama w-2/3 border p-2 rounded text-sm outline-none">
        <button type="button" onclick="this.parentElement.remove()" class="bg-red-500 hover:bg-red-600 text-white px-2 py-1 rounded text-xs">X</button>
      `;
      container.appendChild(row);
    }

    async function loadAdminData() {
      try {
        const res = await fetch(`${API_URL}/latest`, {
          headers: { "X-Master-Key": MASTER_KEY }
        });
        if (!res.ok) throw new Error("Gagal memuat data dari server.");
        const json = await res.json();
        const data = json.record || {};

        if (data.profil) {
          document.getElementById('namaMasjid').value = data.profil.nama || '';
          document.getElementById('alamatMasjid').value = data.profil.alamat || '';
        }
        document.getElementById('runningText').value = data.runningText || '';
        document.getElementById('pengumuman').value = data.pengumuman || '';
        document.getElementById('petugasJumat').value = data.petugasJumat || '';

        if (data.kas) {
          document.getElementById('kasMasuk').value = data.kas.masuk || 0;
          document.getElementById('kasKeluar').value = data.kas.keluar || 0;
        }

        document.getElementById('agendaContainer').innerHTML = '';
        if (data.agenda && Array.isArray(data.agenda)) {
          data.agenda.forEach(a => addAgendaRow(a.tgl, a.kegiatan));
        } else {
          addAgendaRow('Setiap Subuh', 'Kultum Subuh');
        }

      } catch (err) {
        showAlert(`❌ ${err.message}`, false);
      }
    }

    async function saveData(e) {
      e.preventDefault();
      const btn = document.getElementById('btnSubmit');
      btn.disabled = true;
      btn.innerText = "Menyimpan...";

      // Kumpulkan data agenda
      const agendaRows = document.querySelectorAll('.agenda-row');
      const agenda = [];
      agendaRows.forEach(row => {
        const tgl = row.querySelector('.agenda-tgl').value.trim();
        const kegiatan = row.querySelector('.agenda-nama').value.trim();
        if (tgl || kegiatan) agenda.push({ tgl, kegiatan });
      });

      const payload = {
        profil: {
          nama: document.getElementById('namaMasjid').value.trim(),
          alamat: document.getElementById('alamatMasjid').value.trim()
        },
        runningText: document.getElementById('runningText').value.trim(),
        pengumuman: document.getElementById('pengumuman').value.trim(),
        petugasJumat: document.getElementById('petugasJumat').value.trim(),
        kas: {
          masuk: Number(document.getElementById('kasMasuk').value) || 0,
          keluar: Number(document.getElementById('kasKeluar').value) || 0
        },
        agenda
      };

      try {
        const res = await fetch(API_URL, {
          method: "PUT",
          headers: {
            "Content-Type": "application/json",
            "X-Master-Key": MASTER_KEY
          },
          body: JSON.stringify(payload)
        });

        if (!res.ok) throw new Error("Gagal menyimpan ke JSONBin.");

        showAlert("✅ Perubahan berhasil disimpan!");
      } catch (err) {
        showAlert(`❌ ${err.message}`, false);
      } finally {
        btn.disabled = false;
        btn.innerText = "💾 Simpan Semua Perubahan";
      }
    }

    loadAdminData();
  </script>
</body>
</html>
