<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - Panel Kontrol Masjid</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background-color: #f4f6f9; padding-bottom: 50px; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    .card { border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.08); border: none; }
    .btn-success { background-color: #1b5e20; border: none; }
    .btn-success:hover { background-color: #2e7d32; }
  </style>
</head>
<body>

<div class="container mt-4">
  <div class="row justify-content-center">
    <div class="col-md-9">
      <div class="card p-4">
        <h3 class="text-center text-success mb-4 fw-bold">Panel Kontrol Display TV Masjid</h3>
        
        <div id="success-alert" class="alert alert-success" style="display:none;" role="alert">
          Data dan Slideshow berhasil diperbarui ke Display TV!
        </div>

        <form id="adminForm">
          <!-- Identitas & Foto Masjid -->
          <h5 class="border-bottom pb-2 text-success fw-bold">1. Identitas & Foto Masjid</h5>
          <div class="row mb-3">
            <div class="col-md-6 mb-2">
              <label class="form-label">Nama Masjid</label>
              <input type="text" id="namaMasjid" class="form-control" placeholder="Contoh: MASJID JAMI' AT TAQWA">
            </div>
            <div class="col-md-6 mb-2">
              <label class="form-label">Alamat / Kota</label>
              <input type="text" id="alamatMasjid" class="form-control" placeholder="Contoh: Yogyakarta">
            </div>
            <div class="col-12 mb-2">
              <label class="form-label">URL Foto Masjid (Untuk Slide Display)</label>
              <input type="text" id="fotoMasjid" class="form-control" placeholder="https://link-foto.com/masjid.jpg">
            </div>
          </div>

          <!-- Petugas & Foto -->
          <h5 class="border-bottom pb-2 text-success fw-bold mt-4">2. Petugas & Foto Profil</h5>
          <div class="row">
            <!-- Khatib -->
            <div class="col-md-4 mb-3">
              <label class="form-label fw-bold">Khatib</label>
              <input type="text" id="khatib" class="form-control mb-2" placeholder="Nama Khatib">
              <label class="form-label small text-muted">URL Foto Khatib</label>
              <input type="text" id="fotoKhatib" class="form-control" placeholder="https://link-foto.com/khatib.jpg">
            </div>
            <!-- Imam -->
            <div class="col-md-4 mb-3">
              <label class="form-label fw-bold">Imam</label>
              <input type="text" id="imam" class="form-control mb-2" placeholder="Nama Imam">
              <label class="form-label small text-muted">URL Foto Imam</label>
              <input type="text" id="fotoImam" class="form-control" placeholder="https://link-foto.com/imam.jpg">
            </div>
            <!-- Muadzin / Bilal -->
            <div class="col-md-4 mb-3">
              <label class="form-label fw-bold">Bilal / Muadzin</label>
              <input type="text" id="muadzin" class="form-control mb-2" placeholder="Nama Bilal">
              <label class="form-label small text-muted">URL Foto Bilal</label>
              <input type="text" id="fotoMuadzin" class="form-control" placeholder="https://link-foto.com/bilal.jpg">
            </div>
          </div>

          <!-- Pengumuman & Agenda -->
          <h5 class="border-bottom pb-2 text-success fw-bold mt-4">3. Agenda Kajian / Pengumuman</h5>
          <div class="row mb-3">
            <div class="col-md-6 mb-2">
              <label class="form-label">Judul Agenda / Kajian</label>
              <input type="text" id="judulKajian" class="form-control" placeholder="Contoh: KAJIAN FIQIH">
            </div>
            <div class="col-md-6 mb-2">
              <label class="form-label">Penceramah / Pemateri</label>
              <input type="text" id="pemateri" class="form-control" placeholder="Contoh: KH. SOLEHUDIN MANSUR, S.Ag">
            </div>
            <div class="col-12 mb-2">
              <label class="form-label">Waktu & Tempat Kajian</label>
              <input type="text" id="waktuKajian" class="form-control" placeholder="Contoh: Tiap Selasa pukul 16.30 WIB">
            </div>
          </div>

          <!-- Running Text -->
          <h5 class="border-bottom pb-2 text-success fw-bold mt-4">4. Running Text</h5>
          <div class="mb-3">
            <textarea id="runningText" class="form-control" rows="2" placeholder="Mari berdonasi untuk pembangunan masjid..."></textarea>
          </div>

          <button type="submit" id="btnSave" class="btn btn-success w-100 btn-lg mt-3 fw-bold">Simpan & Perbarui Tampilan TV</button>
        </form>
      </div>
    </div>
  </div>
</div>

<script>
  const BIN_ID = "6ac6e08dffd5d16053579b96";
  const ACCESS_KEY = "$2a$10$2gk94J6Zl6Jz5Pe3OOp7W.AxqAKtSjiTMdFfljEODqXoSSHFBGP8K";

  async function loadCloudData() {
    try {
      const response = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
        headers: { 
          "X-Access-Key": ACCESS_KEY,
          "X-Bin-Meta": "false"
        }
      });
      const data = await response.json();

      if (data && !data.message) {
        document.getElementById('namaMasjid').value = data.namaMasjid || "";
        document.getElementById('alamatMasjid').value = data.alamatMasjid || "";
        document.getElementById('fotoMasjid').value = data.fotoMasjid || "";
        document.getElementById('khatib').value = data.khatib || "";
        document.getElementById('fotoKhatib').value = data.fotoKhatib || "";
        document.getElementById('imam').value = data.imam || "";
        document.getElementById('fotoImam').value = data.fotoImam || "";
        document.getElementById('muadzin').value = data.muadzin || "";
        document.getElementById('fotoMuadzin').value = data.fotoMuadzin || "";
        document.getElementById('judulKajian').value = data.judulKajian || "";
        document.getElementById('pemateri').value = data.pemateri || "";
        document.getElementById('waktuKajian').value = data.waktuKajian || "";
        document.getElementById('runningText').value = data.runningText || "";
      }
    } catch (err) {
      console.error("Gagal memuat data:", err);
    }
  }

  loadCloudData();

  document.getElementById('adminForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    const btn = document.getElementById('btnSave');
    btn.disabled = true;
    btn.innerText = "Menyimpan ke Cloud...";

    const newData = {
      namaMasjid: document.getElementById('namaMasjid').value,
      alamatMasjid: document.getElementById('alamatMasjid').value,
      fotoMasjid: document.getElementById('fotoMasjid').value,
      khatib: document.getElementById('khatib').value,
      fotoKhatib: document.getElementById('fotoKhatib').value,
      imam: document.getElementById('imam').value,
      fotoImam: document.getElementById('fotoImam').value,
      muadzin: document.getElementById('muadzin').value,
      fotoMuadzin: document.getElementById('fotoMuadzin').value,
      judulKajian: document.getElementById('judulKajian').value,
      pemateri: document.getElementById('pemateri').value,
      waktuKajian: document.getElementById('waktuKajian').value,
      runningText: document.getElementById('runningText').value
    };

    try {
      const res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
        method: 'PUT',
        headers: {
          "Content-Type": "application/json",
          "X-Access-Key": ACCESS_KEY
        },
        body: JSON.stringify(newData)
      });

      if (res.ok) {
        const alertBox = document.getElementById('success-alert');
        alertBox.style.display = 'block';
        setTimeout(() => alertBox.style.display = 'none', 3000);
      } else {
        alert("Gagal menyimpan perubahan.");
      }
    } catch (err) {
      alert("Terjadi kesalahan koneksi.");
    } finally {
      btn.disabled = false;
      btn.innerText = "Simpan & Perbarui Tampilan TV";
    }
  });
</script>
</body>
</html>
