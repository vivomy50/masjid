<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - Panel Informasi Masjid</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background-color: #f4f6f9; padding-bottom: 50px; }
    .card { border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
    .btn-primary { background-color: #1b5e20; border: none; }
    .btn-primary:hover { background-color: #2e7d32; }
  </style>
</head>
<body>

<div class="container mt-4">
  <div class="row justify-content-center">
    <div class="col-md-8">
      <div class="card p-4">
        <h3 class="text-center text-success mb-4">Panel Kontrol Informasi Masjid</h3>
        
        <div id="success-alert" class="alert alert-success" style="display:none;" role="alert">
          Data berhasil disimpan dan diperbarui di Display TV!
        </div>

        <form id="adminForm">
          <h5 class="border-bottom pb-2 text-secondary">Identitas Masjid</h5>
          <div class="mb-3">
            <label class="form-label">Nama Masjid</label>
            <input type="text" id="namaMasjid" class="form-control" placeholder="Contoh: Masjid Al-Ikhlas">
          </div>
          <div class="mb-3">
            <label class="form-label">Alamat / Lokasi</label>
            <input type="text" id="alamatMasjid" class="form-control" placeholder="Contoh: Jl. Merdeka No. 123">
          </div>

          <h5 class="border-bottom pb-2 text-secondary mt-4">Petugas Jumat / Harian</h5>
          <div class="row">
            <div class="col-md-4 mb-3">
              <label class="form-label">Khatib</label>
              <input type="text" id="khatib" class="form-control">
            </div>
            <div class="col-md-4 mb-3">
              <label class="form-label">Imam</label>
              <input type="text" id="imam" class="form-control">
            </div>
            <div class="col-md-4 mb-3">
              <label class="form-label">Muadzin</label>
              <input type="text" id="muadzin" class="form-control">
            </div>
          </div>

          <h5 class="border-bottom pb-2 text-secondary mt-4">Laporan Keuangan</h5>
          <div class="row">
            <div class="col-md-4 mb-3">
              <label class="form-label">Pemasukan (Rp)</label>
              <input type="text" id="pemasukan" class="form-control">
            </div>
            <div class="col-md-4 mb-3">
              <label class="form-label">Pengeluaran (Rp)</label>
              <input type="text" id="pengeluaran" class="form-control">
            </div>
            <div class="col-md-4 mb-3">
              <label class="form-label">Saldo Saat Ini (Rp)</label>
              <input type="text" id="saldo" class="form-control">
            </div>
          </div>

          <h5 class="border-bottom pb-2 text-secondary mt-4">Pengumuman & Teks Berjalan</h5>
          <div class="mb-3">
            <label class="form-label">Himbauan / Pengumuman</label>
            <textarea id="himbauan" class="form-control" rows="2"></textarea>
          </div>
          <div class="mb-3">
            <label class="form-label">Running Text (Teks Berjalan)</label>
            <textarea id="runningText" class="form-control" rows="2"></textarea>
          </div>

          <button type="submit" id="btnSave" class="btn btn-primary w-100 btn-lg mt-3">Simpan & Perbarui Display TV</button>
        </form>
      </div>
    </div>
  </div>
</div>

<script>
  const BIN_ID = "6ac5370aac6210605a19fc45";
  const ACCESS_KEY = "$2a$10$1QcRWM9V75Gi9P5KELGYU.AtsQXL3hadbNeMh2CApTcv0IQGkeJIO";

  // Memuat data awal saat halaman admin dibuka
  async function loadCloudData() {
    try {
      const response = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
        headers: { 
          "X-Access-Key": ACCESS_KEY,
          "X-Bin-Meta": "false"
        }
      });
      const data = await response.json();

      if (data && !data.message) {
        document.getElementById('namaMasjid').value = data.namaMasjid || "";
        document.getElementById('alamatMasjid').value = data.alamatMasjid || "";
        document.getElementById('khatib').value = data.khatib || "";
        document.getElementById('imam').value = data.imam || "";
        document.getElementById('muadzin').value = data.muadzin || "";
        document.getElementById('pemasukan').value = data.pemasukan || "";
        document.getElementById('pengeluaran').value = data.pengeluaran || "";
        document.getElementById('saldo').value = data.saldo || "";
        document.getElementById('himbauan').value = data.himbauan || "";
        document.getElementById('runningText').value = data.runningText || "";
      }
    } catch (err) {
      console.error("Gagal memuat data awal:", err);
    }
  }

  loadCloudData();

  // Menyimpan data perubahan ke JSONBin
  document.getElementById('adminForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    const btn = document.getElementById('btnSave');
    btn.disabled = true;
    btn.innerText = "Menyimpan ke Cloud...";

    const newData = {
      namaMasjid: document.getElementById('namaMasjid').value,
      alamatMasjid: document.getElementById('alamatMasjid').value,
      khatib: document.getElementById('khatib').value,
      imam: document.getElementById('imam').value,
      muadzin: document.getElementById('muadzin').value,
      pemasukan: document.getElementById('pemasukan').value,
      pengeluaran: document.getElementById('pengeluaran').value,
      saldo: document.getElementById('saldo').value,
      himbauan: document.getElementById('himbauan').value,
      runningText: document.getElementById('runningText').value
    };

    try {
      const res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
        method: 'PUT',
        headers: {
          "Content-Type": "application/json",
          "X-Access-Key": ACCESS_KEY
        },
        body: JSON.stringify(newData)
      });

      const resultJson = await res.json();

      if (res.ok) {
        const alertBox = document.getElementById('success-alert');
        alertBox.style.display = 'block';
        setTimeout(() => alertBox.style.display = 'none', 3000);
      } else {
        alert("Gagal dari JSONBin: " + (resultJson.message || "Pemeriksaan izin kunci gagal"));
      }
    } catch (err) {
      alert("Terjadi kesalahan koneksi internet.");
    } finally {
      btn.disabled = false;
      btn.innerText = "Simpan & Perbarui Display TV";
    }
  });
</script>
</body>
</html>
