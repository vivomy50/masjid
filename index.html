<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Display Masjid</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body {
      background-color: #0b132b;
      color: white;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      overflow: hidden;
      height: 100vh;
      margin: 0;
      display: flex;
      flex-direction: column;
    }

    .main-container {
      flex: 1;
      display: flex;
      height: calc(100vh - 50px);
    }

    /* SIDEBAR KIRI */
    .sidebar-left {
      width: 25%;
      background-color: #0d1b2a;
      padding: 15px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      border-right: 2px solid #1c2541;
      height: 100%;
    }

    .date-box {
      background: #ffffff;
      color: #000000;
      border-radius: 8px;
      padding: 10px;
      text-align: center;
      font-weight: bold;
    }

    .date-masehi {
      font-size: 0.95rem;
      text-transform: uppercase;
      margin-bottom: 2px;
    }

    .date-hijri {
      font-size: 0.9rem;
      color: #333;
    }

    /* BANNER SAMPING KIRI */
    .banner-left-container {
      flex-grow: 1;
      margin: 12px 0;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      border-radius: 10px;
      background-color: rgba(255, 255, 255, 0.05);
    }

    .banner-left-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 10px;
    }

    /* JADWAL SHOLAT */
    .sholat-item {
      background-color: #1b5e20;
      border-radius: 8px;
      padding: 5px 12px;
      margin-bottom: 5px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: bold;
      font-size: 1rem;
    }

    /* AREA KANAN UTAMA */
    .main-content {
      width: 75%;
      display: flex;
      flex-direction: column;
      height: 100%;
    }

    .header-title {
      background-color: #1b5e20;
      padding: 15px 25px;
      border-bottom: 3px solid #fbc02d;
    }

    .header-title h2 {
      margin: 0;
      font-weight: 800;
      letter-spacing: 1px;
      font-size: 1.8rem;
    }

    .header-title p {
      margin: 0;
      font-size: 0.95rem;
      opacity: 0.9;
    }

    /* AREA SLIDE / FOTO UTAMA */
    .slide-container {
      flex: 1;
      padding: 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #0b132b;
      overflow: hidden;
    }

    .slide-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }

    /* FOOTER / RUNNING TEXT */
    .footer-running-text {
      height: 50px;
      background-color: #1b5e20;
      color: #ffffff;
      border-top: 2px solid #fbc02d;
      display: flex;
      align-items: center;
      overflow: hidden;
      font-size: 1.2rem;
      font-weight: 600;
      white-space: nowrap;
    }

    .running-text-content {
      display: inline-block;
      padding-left: 100%;
      animation: marquee 25s linear infinite;
    }

    @keyframes marquee {
      0%   { transform: translate(0, 0); }
      100% { transform: translate(-100%, 0); }
    }
  </style>
</head>
<body>

<div class="main-container">
  <!-- SIDEBAR KIRI -->
  <div class="sidebar-left">
    <div class="date-box">
      <div id="tanggalMasehi" class="date-masehi">KAMIS, 8 OKTOBER 2026</div>
      <div id="tanggalHijriah" class="date-hijri">27 Rabiulakhir 1448 H</div>
    </div>

    <!-- AREA GAMBAR BANNER KIRI -->
    <div class="banner-left-container">
      <img id="gambarKiri" src="https://via.placeholder.com/400x500?text=Banner+Samping" class="banner-left-img" alt="Banner Samping">
    </div>

    <!-- JADWAL SHOLAT -->
    <div class="sholat-container">
      <div class="sholat-item"><span>Imsak</span><span id="imsak">04:02</span></div>
      <div class="sholat-item"><span>Subuh</span><span id="subuh">04:12</span></div>
      <div class="sholat-item"><span>Syuruq</span><span id="syuruq">05:31</span></div>
      <div class="sholat-item"><span>Dzuhur</span><span id="dzuhur">11:52</span></div>
      <div class="sholat-item"><span>Ashar</span><span id="ashar">15:15</span></div>
      <div class="sholat-item"><span>Maghrib</span><span id="maghrib">18:08</span></div>
      <div class="sholat-item"><span>Isya</span><span id="isya">19:22</span></div>
    </div>
  </div>

  <!-- AREA KANAN (HEADER & SLIDE FOTO) -->
  <div class="main-content">
    <div class="header-title">
      <h2 id="dispNamaMasjid">MASJID BESAR AL FALAH WEDUNG</h2>
      <p id="dispAlamatMasjid">JL. RAYA KAUMAN WEDUNG</p>
    </div>

    <!-- SLIDE GAMBAR UTAMA -->
    <div class="slide-container">
      <img id="fotoMasjid" src="https://via.placeholder.com/1200x600?text=Foto+Masjid+Utama" class="slide-img" alt="Foto Masjid / Banner Utama">
    </div>
  </div>
</div>

<!-- RUNNING TEXT FOOTER -->
<div class="footer-running-text">
  <div class="running-text-content" id="dispRunningText">
    Selamat Datang di Masjid Besar Al Falah Wedung. Jagalah kebersihan dan ketertiban di dalam masjid.
  </div>
</div>

<script>
  const BIN_ID = "6ac5370aac6210605a19fc45";
  const ACCESS_KEY = "$2a$10$1QcRWM9V75Gi9P5KELGYU.AtsQXL3hadbNeMh2CApTcv0IQGkeJIO";

  // Perbaikan Tanggal Hijriah agar TIDAK H Ganda
  function updateClockAndDate() {
    const now = new Date();
    const optionsMasehi = { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' };
    document.getElementById('tanggalMasehi').innerText = now.toLocaleDateString('id-ID', optionsMasehi).toUpperCase();

    try {
      const optionsHijri = { day: 'numeric', month: 'long', year: 'numeric' };
      const hijriFormatter = new Intl.DateTimeFormat('id-ID-u-ca-islamic-umalqura', optionsHijri);
      let rawHijri = hijriFormatter.format(now);
      
      // Bersihkan karakter 'H' bawaan jika sudah ada agar tidak ganda
      rawHijri = rawHijri.replace(/\s*H\s*/g, '').trim();
      document.getElementById('tanggalHijriah').innerText = rawHijri + " H";
    } catch (e) {
      document.getElementById('tanggalHijriah').innerText = "27 Rabiulakhir 1448 H";
    }
  }

  // Load Data dari JSONBin Cloud
  async function loadData() {
    try {
      const res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
        headers: { "X-Master-Key": ACCESS_KEY, "X-Access-Key": ACCESS_KEY }
      });
      if (res.ok) {
        const json = await res.json();
        const data = json.record || json;

        if (data.namaMasjid) document.getElementById('dispNamaMasjid').innerText = data.namaMasjid;
        if (data.alamatMasjid) document.getElementById('dispAlamatMasjid').innerText = data.alamatMasjid;
        if (data.gambarKiri) document.getElementById('gambarKiri').src = data.gambarKiri;
        if (data.fotoMasjid) document.getElementById('fotoMasjid').src = data.fotoMasjid;
        if (data.runningText) document.getElementById('dispRunningText').innerText = data.runningText;
      }
    } catch (err) {
      console.log("Gagal memuat data cloud", err);
    }
  }

  setInterval(updateClockAndDate, 1000);
  updateClockAndDate();
  loadData();
  setInterval(loadData, 10000); // Sinkronisasi otomatis tiap 10 detik
</script>
</body>
</html>
