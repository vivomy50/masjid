<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Display Masjid</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background-color: #0d1b2a; color: #ffffff; overflow: hidden; }
    .header-box { background: linear-gradient(90deg, #1b5e20, #2e7d32); padding: 15px; border-bottom: 3px solid #ffd700; }
    .card-custom { background-color: #1b263b; border: 1px solid #415a77; border-radius: 10px; color: #ffffff; }
    .running-text-container { position: fixed; bottom: 0; left: 0; width: 100%; background: #000; color: #ffd700; font-size: 1.5rem; padding: 10px 0; border-top: 2px solid #ffd700; }
  </style>
</head>
<body>

  <!-- Header Nama & Alamat Masjid -->
  <div class="header-box text-center">
    <h1 id="dispNamaMasjid" class="fw-bold m-0">Masjid...</h1>
    <p id="dispAlamatMasjid" class="m-0 fs-5 text-light">Alamat...</p>
  </div>

  <div class="container-fluid mt-4">
    <div class="row">
      <!-- Petugas Jumat -->
      <div class="col-md-6 mb-3">
        <div class="card card-custom p-3">
          <h4 class="text-warning border-bottom pb-2">Petugas Jumat</h4>
          <p class="fs-5 mb-1"><strong>Khatib:</strong> <span id="dispKhatib">-</span></p>
          <p class="fs-5 mb-1"><strong>Imam:</strong> <span id="dispImam">-</span></p>
          <p class="fs-5 mb-0"><strong>Muadzin:</strong> <span id="dispMuadzin">-</span></p>
        </div>
      </div>

      <!-- Keuangan -->
      <div class="col-md-6 mb-3">
        <div class="card card-custom p-3">
          <h4 class="text-warning border-bottom pb-2">Laporan Kas</h4>
          <p class="fs-5 mb-1"><strong>Pemasukan:</strong> Rp <span id="dispPemasukan">0</span></p>
          <p class="fs-5 mb-1"><strong>Pengeluaran:</strong> Rp <span id="dispPengeluaran">0</span></p>
          <p class="fs-5 mb-0"><strong>Saldo:</strong> Rp <span id="dispSaldo">0</span></p>
        </div>
      </div>
    </div>

    <!-- Himbauan / Pengumuman -->
    <div class="row mt-2">
      <div class="col-12">
        <div class="card card-custom p-3">
          <h4 class="text-warning border-bottom pb-2">Himbauan / Pengumuman</h4>
          <p id="dispHimbauan" class="fs-4 m-0">-</p>
        </div>
      </div>
    </div>
  </div>

  <!-- Running Text -->
  <div class="running-text-container">
    <marquee id="dispRunningText" behavior="scroll" direction="left">Memuat informasi...</marquee>
  </div>

  <script>
    const BIN_ID = "6ac5370aac6210605a19fc45";
    const ACCESS_KEY = "$2a$10$1QcRWM9V75Gi9P5KELGYU.AtsQXL3hadbNeMh2CApTcv0IQGkeJIO";

    async function fetchDisplayData() {
      try {
        const response = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
          headers: {
            "X-Access-Key": ACCESS_KEY,
            "X-Bin-Meta": "false"
          }
        });
        const data = await response.json();

        if (data && !data.message) {
          document.getElementById('dispNamaMasjid').innerText = data.namaMasjid || "Masjid";
          document.getElementById('dispAlamatMasjid').innerText = data.alamatMasjid || "";
          document.getElementById('dispKhatib').innerText = data.khatib || "-";
          document.getElementById('dispImam').innerText = data.imam || "-";
          document.getElementById('dispMuadzin').innerText = data.muadzin || "-";
          document.getElementById('dispPemasukan').innerText = data.pemasukan || "0";
          document.getElementById('dispPengeluaran').innerText = data.pengeluaran || "0";
          document.getElementById('dispSaldo').innerText = data.saldo || "0";
          document.getElementById('dispHimbauan').innerText = data.himbauan || "-";
          document.getElementById('dispRunningText').innerText = data.runningText || "";
        }
      } catch (error) {
        console.error("Gagal mengambil data dari cloud:", error);
      }
    }

    // Ambil data pertama kali saat halaman dibuka
    fetchDisplayData();

    // Otomatis memperbarui data setiap 10 detik tanpa reload halaman
    setInterval(fetchDisplayData, 10000);
  </script>
</body>
</html>
