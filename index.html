<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Display Masjid</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background-color: #0b132b;
      color: white;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      overflow: hidden;
      height: 100vh;
      margin: 0;
    }

    .sidebar-left {
      background-color: #0d1b2a;
      height: 100vh;
      padding: 15px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      border-right: 2px solid #1c2541;
    }

    .date-box {
      background: #ffffff;
      color: #000000;
      border-radius: 8px;
      padding: 10px;
      text-align: center;
      font-weight: bold;
    }

    .date-masehi {
      font-size: 0.95rem;
      text-transform: uppercase;
      margin-bottom: 2px;
    }

    .date-hijri {
      font-size: 0.9rem;
      color: #333;
    }

    /* AREA GAMBAR TAMBAHAN DI KIRI */
    .banner-left-container {
      flex-grow: 1;
      margin: 15px 0;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      border-radius: 10px;
      background-color: rgba(255, 255, 255, 0.03);
    }

    .banner-left-img {
      width: 100%;
      height: 100%;
      max-height: 320px;
      object-fit: cover;
      border-radius: 10px;
    }

    /* JADWAL SHOLAT */
    .sholat-item {
      background-color: #1b5e20;
      border-radius: 8px;
      padding: 6px 12px;
      margin-bottom: 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: bold;
      font-size: 1.05rem;
    }

    .header-title {
      background-color: #1b5e20;
      padding: 15px;
      border-bottom: 3px solid #fbc02d;
    }

    .header-title h2 {
      margin: 0;
      font-weight: 800;
      letter-spacing: 1px;
    }

    .header-title p {
      margin: 0;
      font-size: 0.9rem;
      opacity: 0.9;
    }
  </style>
</head>
<body>

<div class="container-fluid p-0">
  <div class="row g-0">
    <!-- SIDEBAR KIRI -->
    <div class="col-3 sidebar-left">
      <!-- TANGGAL -->
      <div class="date-box">
        <div id="tanggalMasehi" class="date-masehi">KAMIS, 8 OKTOBER 2026</div>
        <div id="tanggalHijriah" class="date-hijri">27 Rabiulakhir 1448 H</div>
      </div>

      <!-- AREA GAMBAR / BANNER SAMPING KIRI -->
      <div class="banner-left-container">
        <img id="gambarKiri" src="https://via.placeholder.com/400x500?text=Banner+Masjid" class="banner-left-img" alt="Banner Samping">
      </div>

      <!-- JADWAL SHOLAT -->
      <div class="sholat-container">
        <div class="sholat-item"><span>Imsak</span><span id="imsak">04:02</span></div>
        <div class="sholat-item"><span>Subuh</span><span id="subuh">04:12</span></div>
        <div class="sholat-item"><span>Syuruq</span><span id="syuruq">05:31</span></div>
        <div class="sholat-item"><span>Dzuhur</span><span id="dzuhur">11:52</span></div>
        <div class="sholat-item"><span>Ashar</span><span id="ashar">15:15</span></div>
        <div class="sholat-item"><span>Maghrib</span><span id="maghrib">18:08</span></div>
        <div class="sholat-item"><span>Isya</span><span id="isya">19:22</span></div>
      </div>
    </div>

    <!-- AREA UTAMA KANAN -->
    <div class="col-9">
      <div class="header-title">
        <h2 id="dispNamaMasjid">MASJID BESAR AL FALAH WEDUNG</h2>
        <p id="dispAlamatMasjid">JL. RAYA KAUMAN WEDUNG</p>
      </div>
    </div>
  </div>
</div>

<script>
  const BIN_ID = "6ac5370aac6210605a19fc45";
  const ACCESS_KEY = "$2a$10$1QcRWM9V75Gi9P5KELGYU.AtsQXL3hadbNeMh2CApTcv0IQGkeJIO";

  // Perbaikan Tanggal Masehi & Hijriah
  function updateClockAndDate() {
    const now = new Date();
    const optionsMasehi = { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' };
    document.getElementById('tanggalMasehi').innerText = now.toLocaleDateString('id-ID', optionsMasehi).toUpperCase();

    try {
      const optionsHijri = { day: 'numeric', month: 'long', year: 'numeric' };
      const hijriFormatter = new Intl.DateTimeFormat('id-ID-u-ca-islamic-umalqura', optionsHijri);
      // Format otomatis tanpa merangkap huruf H
      document.getElementById('tanggalHijriah').innerText = hijriFormatter.format(now) + " H";
    } catch (e) {
      document.getElementById('tanggalHijriah').innerText = "27 Rabiulakhir 1448 H";
    }
  }

  // Load Data dari JSONBin Cloud
  async function loadData() {
    try {
      const res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
        headers: { "X-Master-Key": ACCESS_KEY, "X-Access-Key": ACCESS_KEY }
      });
      if (res.ok) {
        const json = await res.json();
        const data = json.record || json;
        if (data.namaMasjid) document.getElementById('dispNamaMasjid').innerText = data.namaMasjid;
        if (data.alamatMasjid) document.getElementById('dispAlamatMasjid').innerText = data.alamatMasjid;
        if (data.gambarKiri) {
          document.getElementById('gambarKiri').src = data.gambarKiri;
        }
      }
    } catch (err) {
      console.log("Gagal memuat data cloud", err);
    }
  }

  setInterval(updateClockAndDate, 1000);
  updateClockAndDate();
  loadData();
  setInterval(loadData, 15000); // Auto-refresh data tiap 15 detik
</script>
</body>
</html>
