<script>
  const BIN_ID = "6ac6e08dffd5d16053579b96";
  const ACCESS_KEY = "$2a$10$2gk94J6Zl6Jz5Pe3OOp7W.AxqAKtSjiTMdFfljEODqXoSSHFBGP8K";

  // Helper untuk Memperbaiki URL Gambar (Imgur & PostImage Direct Link)
  function fixImageUrl(url) {
    if (!url) return '';
    let cleanUrl = url.trim();
    if (cleanUrl.includes('imgur.com') && !cleanUrl.includes('i.imgur.com')) {
      const id = cleanUrl.split('/').pop().split('.')[0];
      return `https://i.imgur.com/${id}.jpg`;
    }
    if (cleanUrl.includes('postimg.cc') && !cleanUrl.includes('i.postimg.cc')) {
      const id = cleanUrl.split('/').pop();
      return `https://i.postimg.cc/${id}/image.jpg`;
    }
    return cleanUrl;
  }

  // 1. Jam Digital & Tanggal Masehi Real-time
  function updateClockAndMasehi() {
    const now = new Date();
    const hrs = String(now.getHours()).padStart(2, '0');
    const mins = String(now.getMinutes()).padStart(2, '0');
    const secs = String(now.getSeconds()).padStart(2, '0');
    document.getElementById('clock').innerText = `${hrs}:${mins}:${secs}`;

    const options = { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' };
    const tglMasehiStr = now.toLocaleDateString('id-ID', options).toUpperCase();
    document.getElementById('dateMasehi').innerText = tglMasehiStr;
  }
  setInterval(updateClockAndMasehi, 1000);
  updateClockAndMasehi();

  // 2. Integrasi Jadwal Sholat Real-time & Hijriah Kemenag/NU
  // Contoh KOTA_ID: "1609" (Yogyakarta) atau "1107" (Demak). Sesuaikan dengan lokasi masjid.
  const KOTA_ID = "1107"; // Kabupaten Demak
  async function updatePrayerTimesAndHijri() {
    try {
      const today = new Date();
      const yyyy = today.getFullYear();
      const mm = String(today.getMonth() + 1).padStart(2, '0');
      const dd = String(today.getDate()).padStart(2, '0');

      // Ambil Jadwal Sholat dari API Resmi MyQuran/Kemenag Indonesia
      const res = await fetch(`https://api.myquran.com/v2/sholat/jadwal/${KOTA_ID}/${yyyy}/${mm}/${dd}`);
      if (!res.ok) throw new Error("Gagal mengambil jadwal sholat");
      
      const json = await res.json();
      const jadwal = json.data.jadwal;

      // Update Elemen HTML Jadwal Sholat
      const prayerItems = document.querySelectorAll('.prayer-item');
      if (prayerItems.length >= 6) {
        prayerItems[0].querySelector('.prayer-time').innerText = jadwal.imsak;
        prayerItems[1].querySelector('.prayer-time').innerText = jadwal.subuh;
        prayerItems[2].querySelector('.prayer-time').innerText = jadwal.dzuhur;
        prayerItems[3].querySelector('.prayer-time').innerText = jadwal.ashar;
        prayerItems[4].querySelector('.prayer-time').innerText = jadwal.maghrib;
        prayerItems[5].querySelector('.prayer-time').innerText = jadwal.isya;
      }

      // Format Tanggal Hijriah
      if (jadwal.date) {
        document.getElementById('dateHijri').innerText = `${jadwal.date}`.toUpperCase();
      }
    } catch (err) {
      console.error("Error Jadwal Sholat / Hijriah:", err);
      // Fallback jika API bermasalah
      fetchHijriFallback();
    }
  }

  // Fallback Hijriah dari Aladhan jika koneksi MyQuran kendala
  async function fetchHijriFallback() {
    try {
      const today = new Date();
      const dd = String(today.getDate()).padStart(2, '0');
      const mm = String(today.getMonth() + 1).padStart(2, '0');
      const yyyy = today.getFullYear();

      const res = await fetch(`https://api.aladhan.com/v1/gToH/${dd}-${mm}-${yyyy}`);
      const json = await res.json();
      const hijri = json.data.hijri;

      const bulanIndo = {
        "Muharram": "MUHARRAM", "Safar": "SAFAR", "Rabi' al-awwal": "RABIUL AWAL",
        "Rabi' al-thani": "RABIUL AKHIR", "Jumada al-ula": "JUMADIL AWAL", "Jumada al-akhirah": "JUMADIL AKHIR",
        "Rajab": "RAJAB", "Sha'ban": "SYA'BAN", "Ramadan": "RAMADHAN",
        "Shawwal": "SYAWAL", "Dhu al-Qi'dah": "DZULQA'DAH", "Dhu al-Hijjah": "DZULHIJJAH"
      };

      const namaBulan = bulanIndo[hijri.month.en] || hijri.month.en.toUpperCase();
      document.getElementById('dateHijri').innerText = `${hijri.day} ${namaBulan} ${hijri.year} H`;
    } catch (e) {
      console.error(e);
    }
  }

  updatePrayerTimesAndHijri();
  // Refresh jadwal sholat otomatis setiap 1 jam sekali
  setInterval(updatePrayerTimesAndHijri, 3600000);

  // 3. Logika Slideshow Otomatis (6 detik)
  let currentSlide = 0;
  const slides = document.querySelectorAll('.slide');

  function nextSlide() {
    slides[currentSlide].classList.remove('active');
    currentSlide = (currentSlide + 1) % slides.length;
    slides[currentSlide].classList.add('active');
  }
  setInterval(nextSlide, 6000);

  // 4. Ambil Data dari JSONBin
  async function fetchDisplayData() {
    try {
      const response = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
        headers: {
          "X-Access-Key": ACCESS_KEY,
          "X-Bin-Meta": "false"
        }
      });
      const data = await response.json();

      if (data && !data.message) {
        document.getElementById('dispNamaMasjid').innerText = data.namaMasjid || "MASJID JAMI' AT TAQWA";
        document.getElementById('dispAlamatMasjid').innerText = data.alamatMasjid || "YOGYAKARTA";
        document.getElementById('dispJudulKajian').innerText = data.judulKajian || "KAJIAN FIQIH";
        document.getElementById('dispPemateri').innerText = data.pemateri || "-";
        document.getElementById('dispWaktuKajian').innerText = data.waktuKajian || "-";
        
        document.getElementById('dispKhatib').innerText = data.khatib || "-";
        if (data.fotoKhatib) document.getElementById('imgKhatib').src = fixImageUrl(data.fotoKhatib);

        document.getElementById('dispImam').innerText = data.imam || "-";
        if (data.fotoImam) document.getElementById('imgImam').src = fixImageUrl(data.fotoImam);

        document.getElementById('dispMuadzin').innerText = data.muadzin || "-";
        if (data.fotoMuadzin) document.getElementById('imgMuadzin').src = fixImageUrl(data.fotoMuadzin);

        if (data.fotoMasjid) document.getElementById('imgMasjid').src = fixImageUrl(data.fotoMasjid);

        document.getElementById('dispRunningText').innerText = data.runningText || "";
      }
    } catch (error) {
      console.error("Gagal mengambil data:", error);
    }
  }

  fetchDisplayData();
  setInterval(fetchDisplayData, 10000);
</script>
